<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/styles.css') }}">
        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
        <title>Admin — API Usage</title>
        <style>
            body {
                padding: 20px;
                text-align: left;
            }

            h2 {
                margin-top: 30px;
                margin-bottom: 6px;
            }

            .cards-layout {
            }

            #card-coingecko,
            #card-etherscan,
            #card-covalent {
                max-width: 550px;
            }

            .api-card {
                background: white;
                border-radius: 8px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
                padding: 20px 24px;
                margin-bottom: 20px;
            }

            .api-card h3 {
                margin: 0 0 16px 0;
                font-size: 16px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .api-card .error-msg {
                color: #721c24;
                font-size: 13px;
            }

            .stat-row {
                display: flex;
                justify-content: space-between;
                font-size: 13px;
                margin-bottom: 10px;
                color: #444;
            }

            .stat-label {
                flex: 0 0 200px;
            }

            .stat-value {
                font-weight: bold;
                text-align: right;
                flex: 1;
            }

            .meter-wrap {
                background-color: #e9ecef;
                border-radius: 4px;
                height: 12px;
                width: 100%;
                margin-bottom: 14px;
                overflow: hidden;
            }

            .meter-bar {
                height: 12px;
                border-radius: 4px;
                transition: width 0.4s;
            }

            .meter-bar.low    { background-color: #28a745; }
            .meter-bar.medium { background-color: #ffc107; }
            .meter-bar.high   { background-color: #dc3545; }

            .meter-label {
                font-size: 11px;
                color: #888;
                margin-bottom: 14px;
                margin-top: -10px;
            }

            .divider {
                border: none;
                border-top: 1px solid #f0f0f0;
                margin: 12px 0;
            }

            .bar-chart {
                display: flex;
                align-items: flex-end;
                gap: 4px;
                height: 140px;
                margin-bottom: 4px;
            }

            .bar-chart-col {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                flex: 1;
            }

            .bar-chart-bar {
                width: 100%;
                background-color: #007bff;
                border-radius: 2px 2px 0 0;
                min-height: 2px;
                transition: height 0.3s;
            }

            .bar-chart-label {
                font-size: 9px;
                color: #aaa;
                margin-top: 3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
                text-align: center;
            }

            .bar-chart-wrapper {
                margin-bottom: 6px;
            }

            .bar-chart-title {
                font-size: 11px;
                color: #888;
                margin-bottom: 4px;
            }

            .badge-plan {
                display: inline-block;
                padding: 2px 10px;
                border-radius: 12px;
                font-size: 11px;
                font-weight: bold;
                background-color: #cce5ff;
                color: #004085;
            }

            #last-updated {
                font-size: 12px;
                color: #888;
                margin-top: 16px;
            }

            #refresh-indicator {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: #28a745;
                margin-right: 5px;
                vertical-align: middle;
            }

            #refresh-indicator.stale { background-color: #dc3545; }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>
                <a href="{{ url_for('main.index') }}"
                   style="text-decoration:none;
                          color:inherit">DeFi Taxes</a> — Admin
            </h1>
        </div>
        <p>
            <a href="{{ url_for('admin.admin_page') }}">&larr; Queue Monitor</a>
            &nbsp;&nbsp;
            <a href="{{ url_for('admin.users_page') }}">Users &rarr;</a>
        </p>
        <h2>API Usage</h2>
        <div class="cards-layout">
            <div class="api-card" id="card-coingecko">
                <h3>
                    CoinGecko <span id="cg-plan"></span>
                </h3>
                <div id="cg-content">
                    <em style="color:#888">Loading…</em>
                </div>
            </div>
            <div class="api-card" id="card-etherscan">
                <h3>Etherscan</h3>
                <div id="es-content">
                    <em style="color:#888">Loading…</em>
                </div>
            </div>
            <div class="api-card" id="card-covalent">
                <h3>CovalentHQ</h3>
                <div id="cv-content">
                    <em style="color:#888">Loading…</em>
                </div>
            </div>
            <div class="api-card" id="card-debank">
                <h3>DeBank</h3>
                <div id="db-content">
                    <em style="color:#888">Loading…</em>
                </div>
            </div>
        </div>
        <div id="last-updated">
            <span id="refresh-indicator"></span>
            <span id="last-updated-text">Waiting for first update…</span>
        </div>
        <script>
            var urls = {
                apiUsageStatus: "{{ url_for('admin.api_usage_status') }}"
            };

            function fmt(n) {
                return n !== undefined && n !== null ? Number(n).toLocaleString() : "—";
            }

            function meterClass(pct) {
                if (pct >= 80) return "high";
                if (pct >= 50) return "medium";
                return "low";
            }

            function usageMeter(used, total, label) {
                var pct = total > 0 ? Math.min(100, (used / total) * 100) : 0;
                return '<div class="meter-wrap"><div class="meter-bar ' + meterClass(pct) + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
                       '<div class="meter-label">' + label + '</div>';
            }

            function showError(targetSelector, message) {
                $(targetSelector).html('<span class="error-msg">Error: ' + message + '</span>');
            }

            function statRow(label, value) {
                return '<div class="stat-row"><span class="stat-label">' + label + '</span><span class="stat-value">' + value + '</span></div>';
            }

            function divider() {
                return '<hr class="divider">';
            }

            function usageSummary(used, total, prefix) {
                var safeUsed = Number(used || 0);
                var safeTotal = Number(total || 0);
                var pct = safeTotal > 0 ? ((safeUsed / safeTotal) * 100).toFixed(1) : 0;
                return usageMeter(
                    safeUsed,
                    safeTotal,
                    prefix + fmt(safeUsed) + ' used of ' + fmt(safeTotal) + ' (' + pct + '%)'
                );
            }

            function formatCountdown(seconds) {
                if (seconds <= 0) return "now";
                var days = Math.floor(seconds / 86400);
                var hrs = Math.floor((seconds % 86400) / 3600);
                var mins = Math.floor((seconds % 3600) / 60);
                if (days > 0) return days + "d " + hrs + "h " + mins + "m";
                if (hrs > 0) return hrs + "h " + mins + "m";
                return mins + "m";
            }

            function secondsUntil(targetDate) {
                return Math.floor((targetDate - new Date()) / 1000);
            }

            function timeUntilNextUtcMidnight() {
                var now = new Date();
                var nextMidnight = new Date(
                    Date.UTC(
                        now.getUTCFullYear(),
                        now.getUTCMonth(),
                        now.getUTCDate() + 1,
                        0,
                        0,
                        0,
                        0
                    )
                );
                return formatCountdown(secondsUntil(nextMidnight));
            }

            function timeUntilMonthReset() {
                var now = new Date();
                var nextMonth = new Date(
                    Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1, 0, 0, 0, 0)
                );
                return formatCountdown(secondsUntil(nextMonth));
            }

            function timeUntilDate(targetDate) {
                return formatCountdown(secondsUntil(targetDate));
            }

            function parseApiDate(s) {
                if (!s) return null;
                var parsed = new Date(s);
                if (!isNaN(parsed.getTime())) return parsed;
                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
                    return new Date(s + "T00:00:00Z");
                }
                return null;
            }

            function addMonthsUtc(dateObj, months) {
                return new Date(
                    Date.UTC(
                        dateObj.getUTCFullYear(),
                        dateObj.getUTCMonth() + months,
                        dateObj.getUTCDate(),
                        dateObj.getUTCHours(),
                        dateObj.getUTCMinutes(),
                        dateObj.getUTCSeconds(),
                        dateObj.getUTCMilliseconds()
                    )
                );
            }

            function renderCoingecko(data) {
                if (data.error) {
                    showError("#cg-content", data.error);
                    return;
                }

                if (data.plan) {
                    $("#cg-plan").html('<span class="badge-plan">' + data.plan + '</span>');
                }

                var used = data.current_total_monthly_calls;
                var total = data.monthly_call_credit;

                var html = "";

                html += usageSummary(used, total, "Monthly calls: ");
                html += statRow("Resets in", timeUntilMonthReset());

                $("#cg-content").html(html);
            }

            function renderDebank(data) {
                if (data.error) {
                    showError("#db-content", data.error);
                    return;
                }

                var html = '';

                // Balance
                html += statRow("Remaining balance (units)", fmt(data.balance));
                html += divider();

                // Daily usage bar chart — stats are newest-first, reverse for chronological left-to-right display
                if (data.stats && data.stats.length > 0) {
                    var days = data.stats.slice().reverse();
                    var maxUsage = Math.max.apply(null, $.map(days, function(d) { return d.usage; }));
                    if (maxUsage === 0) maxUsage = 1;

                    html += '<div class="bar-chart-wrapper">';
                    html += '<div class="bar-chart-title">Daily usage (last ' + days.length + ' days)</div>';
                    html += '<div class="bar-chart">';
                    $.each(days, function(i, d) {
                        var heightPx = Math.max(2, Math.round((d.usage / maxUsage) * 136));
                        var shortDate = d.date.slice(5); // MM-DD
                        html += '<div class="bar-chart-col">' +
                            '<div class="bar-chart-bar" style="height:' + heightPx + 'px;" title="' + d.date + ': ' + fmt(d.usage) + ' units"></div>' +
                            '<div class="bar-chart-label">' + shortDate + '</div>' +
                            '</div>';
                    });
                    html += '</div>';
                    html += '</div>';

                    // Today's usage
                    var today = data.stats[0];
                    html += statRow("Today's usage (" + today.date + ")", fmt(today.usage) + " units");
                    html += statRow(
                        "Yesterday's usage",
                        fmt(data.stats[1] ? data.stats[1].usage : 0) + " units"
                    );
                }

                $("#db-content").html(html);
            }

            function renderEtherscan(data) {
                if (data.error) {
                    showError("#es-content", data.error);
                    return;
                }
                if (data.status !== "1" || !data.result) {
                    showError("#es-content", "Unexpected response: " + JSON.stringify(data));
                    return;
                }

                var r = data.result;
                var used = r.creditsUsed;
                var total = r.creditLimit;

                var html = usageSummary(used, total, "Daily credits: ");
                html += statRow("Resets in", timeUntilNextUtcMidnight());

                $("#es-content").html(html);
            }

            function renderCovalent(data) {
                if (data.error) {
                    showError("#cv-content", data.error);
                    return;
                }

                var payload = data.data || {};
                var aggregate = payload.aggregate || {};

                var consumed = Number(aggregate.credits_consumed || 0);
                var maxCredits = Number(aggregate.max_credits || 0);

                var resetText = null;
                var period = payload.period || {};
                var periodFromRaw = period.from ? String(period.from) : "";
                var periodFrom = parseApiDate(periodFromRaw);
                var periodToRaw = period.to ? String(period.to) : "";
                var periodTo = parseApiDate(periodToRaw);
                var durationMonths = Number(period.duration_months || 0);
                if (periodFrom && durationMonths > 0) {
                    var cycleResetAt = addMonthsUtc(periodFrom, durationMonths);
                    resetText = timeUntilDate(cycleResetAt);
                } else if (periodTo) {
                    // Fallback when cycle metadata is not present.
                    if (/^\d{4}-\d{2}-\d{2}$/.test(periodToRaw)) {
                        periodTo = new Date(periodTo.getTime() + 24 * 60 * 60 * 1000);
                    }
                    resetText = timeUntilDate(periodTo);
                } else {
                    resetText = timeUntilMonthReset();
                }

                var html = "";
                html += usageSummary(consumed, maxCredits, "Monthly credits: ");
                html += statRow("Resets in", resetText);

                $("#cv-content").html(html);
            }

            function refresh() {
                $.getJSON(urls.apiUsageStatus, function(data) {
                    renderCoingecko(data.coingecko || { error: "No data" });
                    renderDebank(data.debank || { error: "No data" });
                    renderEtherscan(data.etherscan || { error: "No data" });
                    renderCovalent(data.covalenthq || { error: "No data" });

                    $("#last-updated-text").text("Last updated: " + new Date().toLocaleTimeString());
                    $("#refresh-indicator").removeClass("stale");
                }).fail(function() {
                    $("#last-updated-text").text("Poll failed at " + new Date().toLocaleTimeString());
                    $("#refresh-indicator").addClass("stale");
                });
            }

            $(document).ready(function() {
                refresh();
            });
        </script>
    </body>
</html>
